name: CI-CD Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Node.js
        run: node --version

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is valid')"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Workflow completed
        run: echo "Build and validation completed"

  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linter
        run: python -m pip install --upgrade pip ruff

      - name: Lint Python files
        run: ruff check . --exclude .git,node_modules,venv,.venv

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript linter
        run: npm install --no-save eslint@9

      - name: Lint JavaScript files
        run: |
          npx eslint --no-config-lookup --no-ignore --no-warn-ignored --no-error-on-unmatched-pattern --stdin --stdin-filename server.js < server.js
