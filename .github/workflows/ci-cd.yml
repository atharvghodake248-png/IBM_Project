```yaml
name: CI-CD Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linter
        run: python -m pip install flake8

      - name: Lint Python Files
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,.venv,venv

      - name: Post Python lint result
        if: always()
        run: echo "Python lint job finished with status ${{ job.status }}"

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JavaScript linter
        run: npm install --global eslint

      - name: Lint JavaScript Files
        shell: bash
        run: |
          files=$(git ls-files '*.js' '*.cjs' '*.mjs')
          if [ -z "$files" ]; then
            echo "No tracked JavaScript files found; nothing to lint."
          else
            eslint --no-config-lookup \
              --rule 'no-unreachable:error' \
              --rule 'no-constant-condition:error' \
              $files
          fi

      - name: Post JavaScript lint result
        if: always()
        run: echo "JavaScript lint job finished with status ${{ job.status }}"
```
